<div class="segment" th:fragment="segment (label, value)">
    <p class="text label" th:text="${label}">N/A</p>
    <p class="text value" th:text="${value}">N/A</p>
</div>

<div class="segment" th:fragment="optionalSegment (label, optional)" th:if="${optional.isPresent()}">
    <p class="text label" th:text="${label}">N/A</p>
    <p class="text value" th:text="${optional.orElseThrow()}">N/A</p>
</div>
