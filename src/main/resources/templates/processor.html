<div id="processor" class="panel" th:fragment="processor" th:if="${#ctx.containsVariable('processor')}">
    <p class="text header">CPU</p>
    <p class="text subheader" th:if="${processor.name.isPresent()}" th:text="${processor.name.orElseThrow()}">N/A</p>
    <hr class="separator_h">
    <div class="group">
        <div th:replace="~{segments :: segment ('Socket(s)', ${processor.socketCount}, null)}"></div>
        <div th:replace="~{segments :: segment ('Core(s)', ${processor.coreCount}, null)}"></div>
        <div th:replace="~{segments :: segment ('Thread(s)', ${processor.threadCount}, null)}"></div>
    </div>
    <hr class="separator_w">
    <div class="group">
        <div th:replace="~{segments :: optionalSegment ('Base Speed', ${processor.baseFrequency})}"></div>
        <div th:replace="~{segments :: optionalSegment ('Max. Speed', ${processor.maxFrequency})}"></div>
        <div th:replace="~{segments :: optionalSegment ('Min. Speed', ${processor.minFrequency})}"></div>
    </div>
    <hr class="separator_w">
    <div class="group">
        <div th:replace="~{segments :: optionalSegment ('L1 Cache', ${processor.getReadableCacheSize(1)})}"></div>
        <div th:replace="~{segments :: optionalSegment ('L2 Cache', ${processor.getReadableCacheSize(2)})}"></div>
        <div th:replace="~{segments :: optionalSegment ('L3 Cache', ${processor.getReadableCacheSize(3)})}"></div>
        <div th:replace="~{segments :: optionalSegment ('L4 Cache', ${processor.getReadableCacheSize(4)})}"></div>
    </div>
    <hr class="separator_w">
    <div class="group">
        <th:block th:each="entry : ${processorUpdate.currentFrequencies}">
            <div th:replace="~{segments :: segment ('CPU ' + ${entry.key}, ${entry.value}, 'cpu' + ${entry.key})}"></div>
        </th:block>
    </div>
</div>
