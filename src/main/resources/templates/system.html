<div id="system" class="panel" th:fragment="system" th:if="${#ctx.containsVariable('system')}">
    <p class="text header">System</p>
    <p class="text subheader" th:text="${system.hostname}">N/A</p>
    <hr class="separator_h">
    <div class="group">
        <div th:replace="~{segments :: segment ('OS', ${system.os}, null)}"></div>
        <div th:replace="~{segments :: segment ('Kernel', ${system.kernel}, null)}"></div>
    </div>
</div>
